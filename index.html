<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="rols.css">
  <link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css"
  />
  <!-- Google tag (gtag.js) -->
<script async src="https://www.googletagmanager.com/gtag/js?id=G-32B908J473"></script>
<script>
  window.dataLayer = window.dataLayer || [];
  function gtag(){dataLayer.push(arguments);}
  gtag('js', new Date());

  gtag('config', 'G-32B908J473');
</script>
  <link rel="icon" href="nonoIcone.png" type="image/x-icon" class="icon">
  <title>Mushoku Tensei Character Roulette</title>
</head>
<body>
  <!-- Loading Screen -->
  <div id="loadingScreen" class="loading-screen">
    <div class="loading-content">
      <div class="loading-spinner"></div>
      <h1 class="loading-text">Loading...</h1>
      <p class="loading-subtitle">Preparing your roulette</p>
      <div class="loading-bar-container">
        <div id="loadingBar" class="loading-bar"></div>
      </div>
      <p id="loadingPercent" class="loading-percent">0%</p>
    </div>
  </div>

  <!-- Start Screen -->
  <div id="startScreen" class="start-screen" style="display: none;">
    <div class="start-content">
      <h1 class="title animate__animated animate__fadeInDown">
        Mushoku Tensei<br>
        <span class="highlight">Character Roulette</span>
      </h1>
      <p class="subtitle">Who will you get?</p>
      <button id="playButton" class="play-btn animate__animated animate__bounceIn">
        <span class="btn-text">Start Rolling</span>
        <span class="btn-icon">UwU > </span>
      </button>
      <p class="hint">Press ENTER or click the button</p>
    </div>
  </div>

  <!-- Result Overlay -->
  <div id="resultOverlay" class="result-overlay" style="display: none;">
    <div class="result-card animate__animated animate__zoomIn">
      <div class="card-header">
        <h2 class="card-title">Your Character</h2>
      </div>
      <div id="resultCardBody" class="card-body">
        <!-- Content will be added dynamically -->
      </div>
    </div>
  </div>

  <video autoplay id="videoPlayer">
    <source src="Untitled video - Made with Clipchamp.mp4" type="video/mp4">
    Your browser does not support the video tag.
  </video>

  <video autoplay loop id="videoPlayer02">
    <source src="back-image/back-aisha.mp4" type="video/mp4">
    Your browser does not support the video tag.
  </video>
 
  <video autoplay loop id="videoPlayer03">
    <source src="back-image/back-nina.mp4" type="video/mp4">
    Your browser does not support the video tag.
  </video>

 <div class="main" id="main">
  <div class="five-div"><div class="F-div"></div></div>
  <div class="S-div"></div>
  <div class="sex-div">
    <div class="T-div"></div>
  </div>
 </div>
 
 <script src="role.js"></script>
 
</body>
</html>
